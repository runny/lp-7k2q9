<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  body { margin: 0; font-family: Inter, system-ui, sans-serif; background: #F2F2F0; color: #4C4C47; }
  main { padding: 40px 48px; max-width: 1100px; }
  h1 { font-weight: 800; font-size: 28px; letter-spacing: -0.6px; color: #3A0600; margin: 0 0 6px; }
  p { margin: 0 0 24px; line-height: 24px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
  .opt { display: block; background: #fff; border-radius: 14px; overflow: hidden; text-decoration: none; color: inherit; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .opt iframe { width: 100%; aspect-ratio: 16/10; border: 0; pointer-events: none; display: block; }
  .opt b { display: block; padding: 12px 16px 4px; color: #3A0600; }
  .opt span { display: block; padding: 0 16px 14px; font-size: 14px; }
  .files { margin-top: 32px; font-size: 14px; line-height: 22px; }
  code { background: #fff; padding: 1px 6px; border-radius: 4px; }
</style>
</head>
<body>
<main>
  <h1>Login prototype</h1>
  <div class="grid">
    <a class="opt" href="login.html?option=A"><iframe src="login.html?option=A" title="Option A"></iframe><b>Option A</b><span>Sky background, logo centred above the card.</span></a>
    <a class="opt" href="login.html?option=B"><iframe src="login.html?option=B" title="Option B"></iframe><b>Option B</b><span>Plain white, logo top left, no card.</span></a>
    <a class="opt" href="login.html?option=C"><iframe src="login.html?option=C" title="Option C"></iframe><b>Option C</b><span>Sky background, logo top left, card.</span></a>
    <a class="opt" href="login.html?option=D"><iframe src="login.html?option=D" title="Option D"></iframe><b>Option D</b><span>As C, with the country switch top right.</span></a>
    <a class="opt" href="login.html?option=E"><iframe src="login.html?option=E" title="Option E"></iframe><b>Option E</b><span>As D, with the website's logo lockup.</span></a>
  </div>
</main>
</body>
</html>
